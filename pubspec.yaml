name: plantora6
description: "Plantora - Intelligent Plant Identification & Agricultural Marketplace"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.2

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Networking
  http: ^1.2.2

  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  socket_io_client: ^3.1.4

  # Social Auth
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.0
  sign_in_with_apple: ^6.1.1
  flutter_markdown: ^0.7.7+1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  share_plus: ^13.2.0
  emoji_picker_flutter: ^4.4.0
  pdf: ^3.12.0
  printing: ^5.14.3
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/plantora_emblem.png"
  adaptive_icon_background: "#053E2B"
  adaptive_icon_foreground: "assets/images/plantora_emblem.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/

